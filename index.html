<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delivery Earnings Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

.container {
    
    border-radius: 15px;
    text-align: center;
}

.card-title {
    color: #94a3b8;
    font-size: 14px;
}

.card-value {
    font-size: 25px;
    font-weight: bold;
    margin-top: 8px;
}

.blue {
    color: #38bdf8;
}

.yellow {
    color: #facc15;
}

.red {
    color: #fb7185;
}

.green {
    color: #4ade80;
}

.table-container {
    overflow-x: auto;
    background: #1e293b;
    border-radius: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 950px;
}

th {
    background: #334155;
    padding: 12px 8px;
}

td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid #334155;
}

input {
    width: 90px;
    padding: 10px;
    font-size: 16px;
    text-align: right;
    border: 1px solid #475569;
    border-radius: 8px;
    background: white;
    color: black;
}

.dailyNet {
    font-weight: bold;
    color: #4ade80;
}

.buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 20px;
    margin-bottom: 20px;
}

button {
    flex: 1;
    min-width: 150px;
    padding: 14px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#save {
    background: #22c55e;
    color: white;
}

#export {
    background: #38bdf8;
    color: #082f49;
}

#reset {
    background: #ef4444;
    color: white;
}

@media (max-width: 700px) {
    body {
        padding: 10px;
    }

    h1 {
        font-size: 24px;
    }

    .summary,
    .extra {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🚗 Delivery Earnings Calculator</h1>

<div class="subtitle">
Uber Eats + DoorDash Weekly Earnings
</div>


<!-- TOP TOTALS -->

<div class="summary">

    <div class="card">
        <div class="card-title">Uber Eats</div>
        <div class="card-value blue" id="uberTotal">$0.00</div>
    </div>

    <div class="card">
        <div class="card-title">DoorDash</div>
        <div class="card-value yellow" id="ddTotal">$0.00</div>
    </div>

    <div class="card">
        <div class="card-title">Electric + Gas</div>
        <div class="card-value red" id="costTotal">$0.00</div>
    </div>

    <div class="card">
        <div class="card-title">Net Earnings</div>
        <div class="card-value green" id="netTotal">$0.00</div>
    </div>

</div>


<!-- DAILY ENTRIES -->

<div class="table-container">

<table>

<thead>

<tr>
    <th>Day</th>
    <th>Uber Eats $</th>
    <th>DoorDash $</th>
    <th>Electric $</th>
    <th>Gas $</th>
    <th>Active Hours</th>
    <th>Miles</th>
    <th>Daily Net</th>
</tr>

</thead>

<tbody id="days"></tbody>

</table>

</div>


<!-- BUTTONS -->

<div class="buttons">

    <button id="save">
        💾 Save Week
    </button>

    <button id="export">
        📄 Export CSV
    </button>

    <button id="reset">
        🗑 Reset
    </button>

</div>


<!-- WEEK TOTALS -->

<div class="extra">

    <div class="card">

        <div class="card-title">
            Total Gross
        </div>

        <div
        class="card-value blue"
        id="grossTotal">
            $0.00
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Total Active Time
        </div>

        <div
        class="card-value"
        id="activeTotal">
            0.00 hr
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Net / Active Hour
        </div>

        <div
        class="card-value green"
        id="netPerHour">
            $0.00
        </div>

    </div>


    <div class="card">

        <div class="card-title">
            Net / Mile
        </div>

        <div
        class="card-value green"
        id="netPerMile">
            $0.00
        </div>

    </div>

</div>

</div>


<script>

const weekDays = [
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday",
    "Sunday"
];

const table =
    document.getElementById("days");


/* CREATE DAYS */

weekDays.forEach((day, index) => {

    const row =
        document.createElement("tr");

    row.innerHTML = `

        <td>
            <strong>${day}</strong>
        </td>

        <td>
            <input
            type="number"
            min="0"
            step="0.01"
            data-day="${index}"
            data-type="uber"
            placeholder="0.00">
        </td>

        <td>
            <input
            type="number"
            min="0"
            step="0.01"
            data-day="${index}"
            data-type="dd"
            placeholder="0.00">
        </td>

        <td>
            <input
            type="number"
            min="0"
            step="0.01"
            data-day="${index}"
            data-type="electric"
            placeholder="0.00">
        </td>

        <td>
            <input
            type="number"
            min="0"
            step="0.01"
            data-day="${index}"
            data-type="gas"
            placeholder="0.00">
        </td>

        <td>
            <input
            type="number"
            min="0"
            step="0.01"
            data-day="${index}"
            data-type="hours"
            placeholder="0.00">
        </td>

        <td>
            <input
            type="number"
            min="0"
            step="0.1"
            data-day="${index}"
            data-type="miles"
            placeholder="0">
        </td>

        <td
        class="dailyNet"
        id="daily-${index}">
            $0.00
        </td>

    `;

    table.appendChild(row);

});


function getNumber(day, type) {

    const input =
        document.querySelector(
            `[data-day="${day}"][data-type="${type}"]`
        );

    return parseFloat(input.value) || 0;

}


/* CALCULATE */

function calculate() {

    let uber = 0;
    let dd = 0;
    let electric = 0;
    let gas = 0;
    let hours = 0;
    let miles = 0;

    weekDays.forEach((day, index) => {

        const dayUber =
            getNumber(index, "uber");

        const dayDD =
            getNumber(index, "dd");

        const dayElectric =
            getNumber(index, "electric");

        const dayGas =
            getNumber(index, "gas");

        const dayHours =
            getNumber(index, "hours");

        const dayMiles =
            getNumber(index, "miles");

        const dailyNet =
            dayUber +
            dayDD -
            dayElectric -
            dayGas;

        document.getElementById(
            "daily-" + index
        ).textContent =
            "$" + dailyNet.toFixed(2);

        uber += dayUber;
        dd += dayDD;
        electric += dayElectric;
        gas += dayGas;
        hours += dayHours;
        miles += dayMiles;

    });


    const gross =
        uber + dd;

    const totalCost =
        electric + gas;

    const net =
        gross - totalCost;

    const netPerHour =
        hours > 0
        ? net / hours
        : 0;

    const netPerMile =
        miles > 0
        ? net / miles
        : 0;


    document.getElementById(
        "uberTotal"
    ).textContent =
        "$" + uber.toFixed(2);


    document.getElementById(
        "ddTotal"
    ).textContent =
        "$" + dd.toFixed(2);


    document.getElementById(
        "costTotal"
    ).textContent =
        "$" + totalCost.toFixed(2);


    document.getElementById(
        "netTotal"
    ).textContent =
        "$" + net.toFixed(2);


    document.getElementById(
        "grossTotal"
    ).textContent =
        "$" + gross.toFixed(2);


    document.getElementById(
        "activeTotal"
    ).textContent =
        hours.toFixed(2) + " hr";


    document.getElementById(
        "netPerHour"
    ).textContent =
        "$" + netPerHour.toFixed(2);


    document.getElementById(
        "netPerMile"
    ).textContent =
        "$" + netPerMile.toFixed(2);

}


/* AUTO CALCULATE */

document
.querySelectorAll("input")
.forEach(input => {

    input.addEventListener(
        "input",
        calculate
    );

});


/* SAVE */

document
.getElementById("save")
.addEventListener(
"click",
() => {

    const data = [];

    weekDays.forEach((day, index) => {

        data.push({

            uber:
                getNumber(index, "uber"),

            dd:
                getNumber(index, "dd"),

            electric:
                getNumber(index, "electric"),

            gas:
                getNumber(index, "gas"),

            hours:
                getNumber(index, "hours"),

            miles:
                getNumber(index, "miles")

        });

    });


    localStorage.setItem(
        "deliveryWeek",
        JSON.stringify(data)
    );


    alert("Week saved!");

});


/* LOAD SAVED DATA */

function loadSaved() {

    const saved =
        localStorage.getItem(
            "deliveryWeek"
        );

    if (!saved) {
        return;
    }


    const data =
        JSON.parse(saved);


    data.forEach((day, index) => {

        const types = [
            "uber",
            "dd",
            "electric",
            "gas",
            "hours",
            "miles"
        ];


        types.forEach(type => {

            const input =
                document.querySelector(
                    `[data-day="${index}"][data-type="${type}"]`
                );


            if (input) {

                input.value =
                    day[type] || "";

            }

        });

    });


    calculate();

}


/* EXPORT CSV */

document
.getElementById("export")
.addEventListener(
"click",
() => {

    const rows = [];

    rows.push([
        "Day",
        "Uber Eats",
        "DoorDash",
        "Electric",
        "Gas",
        "Active Hours",
        "Miles",
        "Daily Net"
    ]);


    let totalUber = 0;
    let totalDD = 0;
    let totalElectric = 0;
    let totalGas = 0;
    let totalHours = 0;
    let totalMiles = 0;


    weekDays.forEach((day, index) => {

        const uber =
            getNumber(index, "uber");

        const dd =
            getNumber(index, "dd");

        const electric =
            getNumber(index, "electric");

        const gas =
            getNumber(index, "gas");

        const hours =
            getNumber(index, "hours");

        const miles =
            getNumber(index, "miles");

        const net =
            uber +
            dd -
            electric -
            gas;


        rows.push([

            day,

            uber.toFixed(2),

            dd.toFixed(2),

            electric.toFixed(2),

            gas.toFixed(2),

            hours.toFixed(2),

            miles.toFixed(1),

            net.toFixed(2)

        ]);


        totalUber += uber;
        totalDD += dd;
        totalElectric += electric;
        totalGas += gas;
        totalHours += hours;
        totalMiles += miles;

    });


    const gross =
        totalUber +
        totalDD;


    const totalCost =
        totalElectric +
        totalGas;


    const net =
        gross -
        totalCost;


    rows.push([]);


    rows.push([

        "WEEK TOTAL",

        totalUber.toFixed(2),

        totalDD.toFixed(2),

        totalElectric.toFixed(2),

        totalGas.toFixed(2),

        totalHours.toFixed(2),

        totalMiles.toFixed(1),

        net.toFixed(2)

    ]);


    rows.push([
        "Gross Earnings",
        gross.toFixed(2)
    ]);


    rows.push([
        "Net Earnings",
        net.toFixed(2)
    ]);


    rows.push([

        "Net Per Active Hour",

        totalHours > 0
        ? (net / totalHours).toFixed(2)
        : "0.00"

    ]);


    rows.push([

        "Net Per Mile",

        totalMiles > 0
        ? (net / totalMiles).toFixed(2)
        : "0.00"

    ]);


    const csv =
        rows
        .map(row =>
            row.join(",")
        )
        .join("\n");


    const blob =
        new Blob(
            [csv],
            {
                type:
                "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    const today =
        new Date()
        .toISOString()
        .slice(0, 10);


    link.download =
        "delivery-earnings-" +
        today +
        ".csv";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

});


/* RESET */

document
.getElementById("reset")
.addEventListener(
"click",
() => {

    const confirmed =
        confirm(
            "Are you sure you want to reset this week?"
        );


    if (!confirmed) {
        return;
    }


    document
    .querySelectorAll("input")
    .forEach(input => {

        input.value = "";

    });


    localStorage.removeItem(
        "deliveryWeek"
    );


    calculate();

});


/* START */

loadSaved();

calculate();

</script>

</body>
</html>
